name: Parliament Settings

before: |
  <p>
    (Since 5.0.0) These settings must be in the [parliament] section, either in their own file or in a shared configuration file.
    Since 7.0.0 the issues are stored in the database like the rest of the parliament, the <code>file</code> setting is only used to import issues from an older issues file.
  </p>
  <p>
    When upgrading to 5.x of Parliament there are some important changes.
    If you were passing in port/certFile/keyFile into the command line arguments when starting Parliament, you must also include those in this configuration file.
    It is recommended that you configure the Auth section in the Parliament UI on the Settings page before upgrading to 5.x.
    The upgrade will update the configuration with your authentication settings, otherwise you will need to input them manually as
    basic password auth has been disabled for Parliament.
  </p>

after: |
  <p>
    Sample configuration:
    <pre>
  [parliament]
  # Only used to import issues from ../etc/parliament.issues.json
  file=../etc/parliament.json

  # Port to listen on
  #port=8008

  ### Parliament supports authentication like viewer/cont3xt, make sure to use the same settings across all tools
  ### Important to use the usersElasticsearch/usersPrefix settings and not the elasticsearch/prefix settings
  #usersElasticsearch=http://localhost:9200
  #usersPrefix=arkime
  #authMode=digest
  #passwordSecret=password
  #httpRealm=Moloch</pre>
  </p>


settings:
  - key: file
    value: "EMPTY (REQUIRED before 7.0.0)"
    text: |
      The location of your Parliament json file.
      (Since 7.0.0) Only used to name the issues file, <code>parliament.json</code> means <code>parliament.issues.json</code>,
      whose issues are imported once when the database has none.
      A parliament file from before Arkime 5 is no longer upgraded, upgrade with Arkime 6.x first.

  - key: port
    value: "8008"
    text: The port that the parliament process listens on.

  - key: parliamentHost
    value: EMPTY
    text: |
      The ip used to listen, usually localhost for just the localhost or 0.0.0.0 for all ips.
      See the <code>host</code> section of
      <a class="no-decoration"
        href="https://nodejs.org/docs/latest/api/net.html#serverlistenport-host-backlog-callback"
        rel="nofollow">https://nodejs.org/docs/latest/api/net.html#serverlistenport-host-backlog-callback</a>
