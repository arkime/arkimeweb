name: Auth OIDC Settings
before: |
  <p>
    Arkime supports direct OIDC authentication when setting <a href="#authMode">authMode</a> to <code>oidc</code>.
    Make sure that each user has the "Web Auth Header" checkbox selected.
  </p>
  <p>
    OIDC is <strong>very tricky</strong> to get set up correctly, you will <strong>not</strong> make it work on the first try.
    If you are new to Arkime we recommend following these steps:
  </p>
  <ol>
      <li>Setup Arkime with <a href="#authMode">authMode</a> set to <code>basic</code> or <code>digest</code>. Get this working.</li>
      <li>Setup Arkime with <strong>one</strong> node configured with <a href="#authMode">authMode</a> set to <code>oidc</code>. Do NOT use a load balancer. Get this working. This is the recommended setup, with the single node being what we call a "central viewer". It will proxy all requests to the other nodes.</li>
      <li>If you must have multiple nodes, this is the next step. Make sure if using a load balancer you have stickiness enabled. We don't recommend more than a few nodes configured this way.</li>
    </ol>
  <p>
    If viewer must go through an HTTP proxy to reach the OIDC provider, see the <a href="/faq#outbound-http-proxy">outbound HTTP proxy FAQ</a>.
  </p>
  <p>
    These settings should live in the <code>[cont3xt]</code>, <code>[parliament]</code>, <code>[wiseService]</code> or <code>[default]</code> sections depending on the Arkime application.
  </p>

after: |
  <p>
    Example:
  </p>
  <pre><code>authDiscoverURL=[DISCOVER or ISSUER or WELLKNOWN URL]
  authClientId=[CLIENTID]
  authClientSecret=[CLIENTSECRET]
  authUserIdField=preferred_username
  authRedirectURIs=http://ARKIMEHOST:PORT/auth/login/callback
  # Leave logoutUrl unset, Arkime builds it from the provider, see Logout below
  # Only set it if the provider has no end_session_endpoint
  #logoutUrl=https://the.oidc.provider.com/logout

  # Optional to auto create users, see the <a href="#user-auto-create">[user-auto-create]</a> section
  # Make sure userId/userName variables are correct
  [user-auto-create]
  userId=vals.preferred_username
  userName=vals.name
  enabled=true
  webEnabled=true
  headerAuthEnabled=true
  emailSearch=true
  createEnabled=false
  removeEnabled=false
  packetSearch=true
  roles=['arkimeUser', 'cont3xtUser']
  </code></pre>

  <h4 id="oidc-logout">Logout</h4>
  <p>
    Since 6.0.0, when <a href="#logoutUrl">logoutUrl</a> is not set and <a href="#authRedirectURIs">authRedirectURIs</a> is, Arkime builds the logout button's url from the provider's <code>end_session_endpoint</code>.
    Clicking logout sends the browser to the provider, which ends the OIDC session and then redirects back to Arkime's <code>/auth/logout/callback</code>.
    That callback is what removes the Arkime session and its <code>ARKIME-SID</code> cookie, so if the provider does not redirect back the user is still logged into Arkime.
  </p>
  <ol>
    <li>Register <code>http://ARKIMEHOST:PORT/auth/logout/callback</code> with the provider as an allowed post logout redirect URI. In Keycloak this is the client's <strong>Valid post logout redirect URIs</strong> setting. Arkime builds it from the first <a href="#authRedirectURIs">authRedirectURIs</a> entry, so use the same scheme, host, port and base path as that entry.</li>
    <li>Leave <a href="#logoutUrl">logoutUrl</a> unset. When it is set Arkime uses it as is, and the provider is not told to redirect back to Arkime.</li>
    <li>Test by clicking logout, you should end up on the provider's login page. If the provider shows an "Invalid redirect uri" error, register the exact <code>post_logout_redirect_uri</code> value from the url in the browser's address bar.</li>
  </ol>
  <p>
    Each Arkime application using OIDC (Viewer, Cont3xt, Parliament, WISE) needs its own logout callback registered.
  </p>

settings:
  - key: authDiscoverURL
    value: EMPTY
    text: |
      The OIDC discover well-known URL.

  - key: authClientId
    value: EMPTY
    text: |
      The OIDC client id

  - key: authClientSecret
    value: EMPTY
    text: |
      The OIDC client secret

  - key: authUserIdField
    value: EMPTY
    text: |
      The field to use in the response from OIDC that contains the userId

  - key: authRedirectURIs
    value: EMPTY
    text: |
      Comma separated list of redirect URLs. Each URL should usually end with <code>/auth/login/callback</code>.
      The first URL is also used to build the <code>/auth/logout/callback</code> URL, see <a href="#oidc-logout">Logout</a>.

  - key: authOIDCScope
    value: openid
    text: The OIDC scope

  - key: authJwsAlgorithm
    value: RS256
    text: (Since 6.0.0) The JWS algorithm to use, must match the provider settings.



