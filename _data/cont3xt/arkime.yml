name: "Arkime Integration"
before: |
  Since 5.0 Cont3xt can query Arkime for results.
  This integration must be enabled in the configuration file and not the UI.
  To enable, create a <code>[arkime:NAME]</code> section where NAME is unique.

settings:
  - key: name
    value: section name
    text: The friendly name to show the user in the UI

  - key: icon
    value: icon for integration in UI
    text: Path to icon to use in UI

  - key: order
    value: 50000
    text: The sort order for the integration

  - key: prefix
    value: arkime
    text: The prefix used for the OpenSearch/Elasticsearch indices, see <a href="settings#prefix">settings</a>

  - key: elasticsearch
    value: http://localhost:9200
    text: The OpenSearch/Elasticsearch url, see <a href="settings#elasticsearch">settings</a>

  - key: elasticsearchAPIKey
    value: EMPTY
    text: The Elasticsearch API key, see <a href="settings#elasticsearchAPIKey">settings</a>

  - key: elasticsearchBasicAuth
    value: EMPTY
    text: The OpenSearch/Elasticsearch basic auth information, see <a href="settings#elasticsearchBasicAuth">settings</a>

  - key: maxResults
    value: 20
    text: The maximum number of results to return from Arkime

  - key: searchDays
    value: -1 == ALL
    text: The number of past days to search Arkime

  - key: arkimeUrl
    value: http://localhost:8005
    text: The url to the Arkime UI

  - key: insecure
    value: false
    text: If true certificate verification will be disabled for https calls to <code>elasticsearch</code>, useful for self signed certificates. (Since 7.0) The <code>--insecure</code> command line option also disables it, and an https url on localhost skips verification unless this is set to false, like the OpenSearch/Elasticsearch connections.

  - key: caTrustFile
    value: EMPTY
    text: (Since 7.0) File with PEM encoded CA certificates to trust for https calls to <code>elasticsearch</code>, which replaces the system CAs. It does not fall back to the <code>[cont3xt]</code> caTrustFile.

  - key: clientKey
    value: EMPTY
    text: (Since 7.0) PEM encoded private key file presented to the server for client certificate (mTLS) authentication. Must also set clientCert.

  - key: clientCert
    value: EMPTY
    text: (Since 7.0) PEM encoded certificate file presented to the server for client certificate (mTLS) authentication. Must also set clientKey.

  - key: clientKeyPass
    value: EMPTY
    text: (Since 7.0) The passphrase for clientKey, if it has one.

after: |
  Here is the example configuration that the demo site uses:
  <pre>
  [arkime:arkime]
  name=Arkime
  arkimeUrl=https://demo.arkime.com
  searchDays=-1
  </pre>

