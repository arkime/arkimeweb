name: "JSON Integration"
before: |
  Since 5.0 Cont3xt can query JSON files or urls for results.

  Create a <code>[json:NAME]</code> section where NAME is a name that is unique across all integrations

settings:
  - key: name
    value: section name
    text: The friendly name to show the user in the UI

  - key: icon
    value: icon for integration in UI
    text: Path to icon to use in UI

  - key: order
    value: 50000
    text: The sort order for the integration

  - key: itypes
    value: REQUIRED
    text: Comma separated list of itypes this integration supports

  - key: url
    value: REQUIRED
    text: |
      Where to find the JSON file. It can be file://PATH, http(s)://PATH, or redis://[:pass@]redishost[:redisport]/redisDbNum/key. The URL must return the entire JSON document.

  - key: reload
    value: EMPTY
    text: How often in minutes to reload the JSON file. For file urls cont3xt will monitor the files for changes automatically.

  - key: arrayPath
    value: EMPTY
    text: The path in the JSON document to find the array of values, if not set it is assumed the JSON document is an array at the top level.

  - key: keyPath
    value: REQUIRED
    text: The path inside each item of the array that contains the key that lookups should be performed on.
  - key: insecure
    value: false
    text: If true certificate verification will be disabled for https calls to <code>url</code>, useful for self signed certificates. (Since 7.0) Only used for http(s) urls. The <code>--insecure</code> command line option also disables it, and an https url on localhost skips verification unless this is set to false, like the OpenSearch/Elasticsearch connections.

  - key: caTrustFile
    value: EMPTY
    text: (Since 7.0) File with PEM encoded CA certificates to trust for https calls to <code>url</code>, which replaces the system CAs. It does not fall back to the <code>[cont3xt]</code> caTrustFile.

  - key: clientKey
    value: EMPTY
    text: (Since 7.0) PEM encoded private key file presented to the server for client certificate (mTLS) authentication. Must also set clientCert.

  - key: clientCert
    value: EMPTY
    text: (Since 7.0) PEM encoded certificate file presented to the server for client certificate (mTLS) authentication. Must also set clientKey.

  - key: clientKeyPass
    value: EMPTY
    text: (Since 7.0) The passphrase for clientKey, if it has one.
