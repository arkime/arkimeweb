name: "ClickHouse Integration"
before: |
  Since 5.2 Cont3xt can query ClickHouse for results.

  Create a <code>[clickhouse:NAME]</code> section where NAME is a name that is unique across all integrations

settings:
  - key: name
    value: section name
    text: The friendly name to show the user in the UI

  - key: icon
    value: ClickHouse icon
    text: Path to icon to use in UI

  - key: order
    value: 50000
    text: The sort order for the integration

  - key: itypes
    value: REQUIRED
    text: Comma separated list of itypes this integration supports

  - key: statement
    value: REQUIRED
    text: The SQL statement to run; the <code>{value:&nbsp;String}</code> named parameter will be replaced with the search value

  - key: url
    value: REQUIRED
    text: The ClickHouse URL
