name: Redis
before: |
  <p>
    Redis can be used as a wise data source.
    If using Redis as a wise cache you'll probably want to use a different Redis "database" by specifying the database number in the url. Example: <code>url=redis://localhost/1</code>
    Each Redis source can only handle one type of data, although multiple Redis sources can be configured and they can use the same Redis database.
    <br>
    Create a <code>[redis:UNIQUENAME]</code> section to configure.
  </p>

settings:
  - key: redisURL
    value: REQUIRED
    text: The format is <code>redis://[:password@]host:port/db-number</code>, <code>redis-sentinel://[[sentinelPassword]:[password]@]host[:port]/redis-name/db-number</code>, or <code>redis-cluster://[:password@]host:port/db-number</code>

  - key: redisMethod
    value: get
    text: The lowercase Redis method to retrieve values

  - key: tags
    value: REQUIRED
    text: Comma separated list of tags to set for matches

  - key: type
    value: REQUIRED
    text: The type of data in Redis, such as ip,domain,md5,ja3,email, or something defined in <code>[wise-types]</code>

  - key: format
    value: csv
    text: csv,<a href="/taggerformat">tagger</a>,json,jsonl - The format of the data

  - key: column
    value: 0
    text: For csv formatted data, which column is the data

  - key: template
    value: "%key%"
    text: The template when forming the key name. %key% = the key being looked up, %type% = the type being looked up.

  - key: keyPath
    value: REQUIRED
    text: The path of what field to use as the key when in json/jsonl mode
