name: General
before: |
  <p>
    General settings for WISE, located in a <code>[wiseService]</code> section.
  </p>

settings:
  - key: port
    value: 8081
    text: Port that wiseService listens on

  - key: wiseHost
    value: EMPTY
    text: Host that wiseService listens on

  - key: sourcePath
    value: "/opt/arkime/wiseService"
    text: Directory to look for wise source files

  - key: webBasePath
    value: "/"
    text: The base path for the WISE web interface. Must match any reverse proxy configuration.

  - key: userNameHeader
    value: EMPTY
    text: The HTTP header containing the authenticated username (for reverse proxy auth)

  - key: esClientCert
    value: EMPTY
    text: (Since 7.0) The public key file to use for tls client authentication with the users OpenSearch/Elasticsearch. Must also set esClientKey.

  - key: esClientKey
    value: EMPTY
    text: (Since 7.0) The private key file to use for tls client authentication with the users OpenSearch/Elasticsearch. Must also set esClientCert.

  - key: esClientKeyPass
    value: EMPTY
    text: (Since 7.0) The password for the esClientKey setting.

  - key: updateTime
    value: 0
    text: A timestamp automatically updated when the WISE config is saved via the WISE UI; other wiseService instances poll this value and restart when it increases. You should not usually set this by hand.

  - key: footerTemplate
    value: "_version_ | <a href=\"https://arkime.com/wise\">arkime.com/wise</a>"
    text: HTML template for the footer displayed in the WISE UI
