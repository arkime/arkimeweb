name: URL API
before: |
  <p>
    (Since 6.0) The wiseService can fetch a URL for every request. Each urlapi needs to have its own section, with the section name starting with <code>urlapi:</code>.
    <br>
    Create a <code>[urlapi:NAME]</code> section to configure
  </p>

settings:
  - key: url
    value: REQUIRED
    text: "The URL to load data from. In the url <code>{value}</code> is replaced with the url encoded request value, <code>{valueBase64}</code> (Since 6.8.0) with the base64 encoded value (then url encoded, since base64 has / + and =), and <code>{valueBase64Url}</code> (Since 6.8.0) with the base64url encoded value without padding, which is what apis such as VirusTotal expect for url lookups."

  - key: tags
    value: EMPTY
    text: Comma separated list of tags to set for matches

  - key: type
    value: REQUIRED
    text: The type of data such as ip,domain,md5,ja3,email, or something defined in <code>[wise-types]</code>

  - key: headers
    value: EMPTY
    text: Semicolon separated list of headers to send in the URL request

  - key: insecure
    value: false
    text: (Since 6.9.0) If true certificate verification will be disabled for https calls to <code>url</code>, useful for self signed certificates. (Since 7.0) The <code>--insecure</code> command line option also disables it, and an https url on localhost skips verification unless this is set to false, like the OpenSearch/Elasticsearch connections.

  - key: caTrustFile
    value: EMPTY
    text: (Since 7.0) File with PEM encoded CA certificates to trust for https calls to <code>url</code>, which replaces the system CAs. It does not fall back to the <code>[wiseService]</code> caTrustFile.

  - key: clientKey
    value: EMPTY
    text: (Since 7.0) PEM encoded private key file presented to the server for client certificate (mTLS) authentication. Must also set clientCert.

  - key: clientCert
    value: EMPTY
    text: (Since 7.0) PEM encoded certificate file presented to the server for client certificate (mTLS) authentication. Must also set clientKey.

  - key: clientKeyPass
    value: EMPTY
    text: (Since 7.0) The passphrase for clientKey, if it has one.

  - key: resultField
    value: REQUIRED
    text: Field that is required to be in the result to consider it a match
