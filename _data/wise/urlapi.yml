name: URL API
before: |
  <p>
    (Since 6.0) The wiseService can fetch a URL for every request. Each urlapi needs to have its own section, with the section name starting with <code>urlapi:</code>.
    <br>
    Create a <code>[urlapi:NAME]</code> section to configure
  </p>

settings:
  - key: url
    value: REQUIRED
    text: "The URL to load data from. In the url <code>{value}</code> is replaced with the url encoded request value, <code>{valueBase64}</code> (Since 6.7.1) with the base64 encoded value (then url encoded, since base64 has / + and =), and <code>{valueBase64Url}</code> (Since 6.7.1) with the base64url encoded value without padding, which is what apis such as VirusTotal expect for url lookups."

  - key: tags
    value: EMPTY
    text: Comma separated list of tags to set for matches

  - key: type
    value: REQUIRED
    text: The type of data such as ip,domain,md5,ja3,email, or something defined in <code>[wise-types]</code>

  - key: headers
    value: EMPTY
    text: Semicolon separated list of headers to send in the URL request

  - key: resultField
    value: REQUIRED
    text: Field that is required to be in the result to consider it a match
