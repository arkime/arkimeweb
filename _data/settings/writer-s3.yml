name: "Writer - S3 - Settings"
before: |
  <p>
    See <a href="/s3">S3</a> document for more information about using S3 for PCAP storage.
  </p>
  <p>
    (Since 7.0.0) AWS credentials are found in this order: the <a href="#s3AccessKeyId">s3AccessKeyId</a> setting, the <code>AWS_ACCESS_KEY_ID</code>
    environment variables, the <code>~/.aws</code> credentials and config files (use <code>--profile</code> to pick a profile),
    EKS IRSA (<code>AWS_ROLE_ARN</code> + <code>AWS_WEB_IDENTITY_TOKEN_FILE</code>), EKS Pod Identity
    (<code>AWS_CONTAINER_CREDENTIALS_FULL_URI</code> + <code>AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE</code>), ECS, and finally the
    EC2 instance metadata, see <a href="#awsUseTokenForMetadata">awsUseTokenForMetadata</a>. An empty <a href="#s3AccessKeyId">s3AccessKeyId</a> is the same as not set.
  </p>
  <p>
    (Since 7.0.0) Before 7.0.0 the s3 writer used the instance role ahead of the AWS environment variables and <code>~/.aws</code> files,
    so a host with both now uses the environment variables or files instead.
  </p>

settings:
  - key: s3Region
    value: us-east-1
    text: |
      S3 Region to send data to

  - key: s3Bucket
    value: EMPTY
    text: |
      S3 Bucket to store PCAP files

  - key: s3AccessKeyId
    value: EMPTY
    text: |
      S3 Access Key ID, when not set the credentials are found as described above.

  - key: s3SecretAccessKey
    value: EMPTY
    text: |
      S3 Secret Access Key

  - key: s3Compress
    value: "false"
    text: |
      Should HTTP requests be compressed before sending; it is usually better to enable PCAP compression instead.

  - key: s3WriteGzip
    value: "false"
    text: |
      Should the PCAP files be stored on S3 in gzipped form.
      Since 4.3.0 if <a href="#s3Compression">s3Compression</a> is set this setting is ignored.
      Since 5.0.0 this setting has been removed.

  - key: s3StorageClass
    value: STANDARD
    text: |
      The S3 storage class to use&mdash;this has pricing implications.

  - key: s3PathAccessStyle
    value: "true if there is a period in the bucket name"
    text: |
      If true use <code>s3.amazonaws.com/s3Bucket</code> if false use <code>s3Bucket.s3.amazonaws.com</code>. For MinIO, make sure you set to true.

  - key: s3MaxConns
    value: 20
    text: |
      Max connections to S3.

  - key: s3MaxRequests
    value: 500
    text: |
      Max number of outstanding S3 requests.

  - key: s3ExpireDays
    value: EMPTY
    text: |
      Expiration days for S3 stored PCAP files. Expired PCAP files will be deleted.

  - key: s3Host
    value: EMPTY
    text: |
      Override the default endpoint URL for the specified Bucket and Region. This is only
      used if you want to use a third party s3 server, like a
      <a href="https://min.io/">MinIO</a> instance.

  - key: s3UseHttp
    value: "false"
    text: |
      Use HTTP instead of HTTPS to connect to S3 host.
      (Since 7.0.0) Also used by the s3/sqs readers when <a href="#s3Host">s3Host</a> is set.

  - key: s3UseTokenForMetadata
    value: "true"
    text: |
      (Since 7.0.0) The older name for <a href="#awsUseTokenForMetadata">awsUseTokenForMetadata</a>, which is used if both are set.
      If true then use <a href="https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html">IMDSv2</a>
      token to retrieve instance metadata and IAM credentials when running on EC2; if false then use IMDSv1.

  - key: s3Compression
    value: zstd (>= 5.0) EMPTY (4.3 - 4.x)
    text: |
      (Since 4.3.0) Select which type of compression is used when storing PCAP in S3. Valid values are EMPTY (same as none), none, gzip, zstd.

  - key: s3CompressionLevel
    value: 0
    text: |
      (Since 4.3.0) Select which compression level to use with gzip or zstd. 0 will use the default level.

  - key: s3CompressionBlockSize
    value: 100000
    text: |
      (Since 4.3.0) The block size to use when compressing PCAP for S3 storage.
      Do not change to values larger than 100000 if still using both older and newer versions of Arkime.

  - key: s3UseECSEnv
    value: "false"
    text: |
      <strong>No longer needed in 7.0.0:</strong> ECS container credentials are found automatically and setting this only logs a warning.<br>
      (Since 4.3.0) Use the <code>ECS_CONTAINER_METADATA_URI_V4</code> and <code>AWS_CONTAINER_CREDENTIALS_RELATIVE_URI</code> environment variables to find the metadata service.

  - key: s3GapPacketPos
    value: "true"
    text: |
      (Since 5.0.0) Encode <code>packetPos</code> using a simple gap encoding; this reduces storage in OpenSearch/Elasticsearch.
