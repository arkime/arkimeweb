name: "Reader - AFPacket - Settings"
before: |
  <p>
    AFPacket v3, also known as TPacket v3, is the preferred reader for Arkime and can be used on most 3.x or later Linux kernels.
    Configure capture to use AFPacket v3 as the reader method with <code>pcapReadMethod=tpacketv3</code> in your configuration file.
  </p>

after: |
  <p class="mb-0">
    Example:
  </p>
  <pre><code>[default]
  pcapReadMethod = tpacketv3
  tpacketv3BlockSize = 2097152
  interface = eth0
  tpacketv3NumThreads = 2</code></pre>


settings:
  - key: tpacketv3BlockSize
    value: "2097152"
    text: |
      The block size in bytes used for reads from each interface. There are 64 blocks per thread.

  - key: tpacketv3NumThreads
    value: "2"
    text: |
      The number of threads used to read packets from each interface. These threads take the packets from the AF packet interface and place them into the packet queues.

  - key: tpacketv3ClusterId
    value: "0"
    text: |
      The cluster id for use with <code>PACKET_FANOUT</code>, from 0 to 65535.
      (Since 7.0.0) The default is <code>0</code>, which has the kernel pick an unused fanout group id for each interface, so several capture processes on one host no longer need different ids. This requires Linux 4.12 or later, and capture logs the id the kernel picked. Before 7.0.0 the default was <code>8005</code> and 0 wasn't allowed.
      With any other value the first interface uses <code>tpacketv3ClusterId</code>, the second <code>tpacketv3ClusterId</code> + 1 and so on, so each capture process on a host needs its own range. Set <code>tpacketv3ClusterId=8005</code> for the old behavior.
      An <code>Error setting packet fanout</code> error that ends with <code>Invalid argument</code> usually means the interface is DOWN and needs to be brought UP.

  - key: tpacketv3ClusterIdUnique
    value: "false"
    text: |
      (Since 6.9.3) Set to true to let the kernel assign a <code>PACKET_FANOUT</code> group id per interface instead of using <a href="#tpacketv3ClusterId">tpacketv3ClusterId</a>. This keeps the process from joining a fanout group already used by another process. Requires Linux 4.12 or later.

  - key: tpacketv3OldVlan
    value: "false"
    text: |
      (Since 6.0) Set to true to use the old VLAN handling method where AFPacket would strip the first VLAN tag and not save it in the PCAP. The new default will add the VLAN tag back into the packet data before saving to PCAP.
