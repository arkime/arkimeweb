name: Packet Portal Settings
before: |
  <p>
    <strong>Experimental &mdash; added in Arkime 6.7.0.</strong>
  </p>
  <p>
    Packet Portals are a second viewer&#8209;to&#8209;viewer transport for clusters where a
    Sensor's viewer cannot be reached directly by the Central Viewer &mdash; for example a
    Sensor behind NAT or a firewall, or a Central Viewer that is fronted by a reverse proxy,
    uses header authentication, and is IP locked down. Normally viewers talk to each other with
    short&#8209;lived outbound HTTP requests, which requires the target viewer to be directly
    reachable from the caller. A packet portal removes that requirement.
  </p>
  <p>
    The <strong>Sensor</strong> (an edge capture node whose viewer cannot accept inbound
    connections) opens a long&#8209;lived outbound connection to the <strong>Central
    Viewer</strong>. The Central Viewer can then send its normal node&#8209;to&#8209;node
    requests (pcap retrieval, hunts, cron queries, per&#8209;node proxying) back down that
    connection &mdash; in the reverse of the direction it was opened. When no portal is present
    everything falls back to normal node&#8209;to&#8209;node HTTP, so the feature is purely
    additive.
  </p>
  <p>
    Portals reuse the existing <a href="#serverSecret">serverSecret</a>/<code>x-arkime-auth</code>
    server&#8209;to&#8209;server authentication: every request carried over the portal is
    individually S2S authenticated. As with all S2S auth, viewer clocks must be within 2 minutes of
    each other. Requests arriving over a portal are authenticated by the S2S token <em>only</em>
    &mdash; the loopback address they appear to originate from and any <code>userNameHeader</code>
    they carry are not trusted, so header/IP authentication cannot be spoofed through a portal.
  </p>
  <p>
    <code>serverSecret</code> is shared by every node in the cluster, so on its own it only proves
    the caller is <em>some</em> node, not <em>which</em> node. Because a Sensor names itself when it
    opens a portal, the Central Viewer authenticates that claim separately using the
    <a href="#packetportal-nodes">[packetportal-nodes]</a> section (a per node password and/or
    source IP, falling back to <a href="/esproxy#esproxy-sensors-section">[esproxy-sensors]</a>), so one compromised
    Sensor cannot claim another Sensor's node name and take over its traffic. When neither section
    is configured, each node is pinned to the source IP it first connects from.
  </p>
  <p>
    While a Sensor is using a portal it is treated as reachable <em>only</em> over that portal (it
    is behind NAT), so the Central Viewer never falls back to a direct connection for it. If it
    stops using portals altogether that stops applying after
    <code>packetPortalReverseTTLMinutes</code>, and the Central Viewer dials it directly again.
  </p>
  <p>
    On the Central Viewer, pick <strong>one</strong> way to accept portals: a dedicated
    <code>packetPortalPort</code> (recommended, so the portal has its own firewall rules and is not
    affected by the main viewer port's proxy / header auth / IP restrictions), or
    <code>packetPortalListen=true</code> to accept portals on the existing viewer port.
  </p>

settings:
  - key: packetPortalPort
    value: "not set"
    text: |
      <strong>Central Viewer.</strong> Listen for inbound packet portals on this dedicated port
      (recommended). When set, portals are accepted only here and the main viewer port is left
      untouched. Use a port above 1024 (the listener binds after privileges are dropped).

  - key: packetPortalHost
    value: all interfaces
    text: |
      <strong>Central Viewer.</strong> Bind address for the dedicated
      <code>packetPortalPort</code>.

  - key: packetPortalKeyFile
    value: 'falls back to <a href="#keyFile">keyFile</a>'
    text: |
      <strong>Central Viewer.</strong> TLS private key for the dedicated portal port. TLS is
      optional and independent of the main viewer (which may itself be plain behind a
      TLS&#8209;terminating proxy). If unset, falls back to the viewer's
      <a href="#keyFile">keyFile</a>; if neither is present the portal port runs plain (only safe on
      a trusted network &mdash; pcap and the s2s token would be in the clear).

  - key: packetPortalCertFile
    value: 'falls back to <a href="#certFile">certFile</a>'
    text: |
      <strong>Central Viewer.</strong> TLS certificate for the dedicated portal port. See
      <code>packetPortalKeyFile</code>.

  - key: packetPortalListen
    value: "false"
    text: |
      <strong>Central Viewer.</strong> Accept packet portals on the existing viewer port instead
      of a dedicated port. Ignored when <code>packetPortalPort</code> is set.

  - key: packetPortalConnect
    value: "not set"
    text: |
      <strong>Sensor.</strong> Semicolon separated list of Central Packet portal base URLs to keep
      an outbound portal open to. A portal is maintained to each (so multiple Central Viewers can
      reach this Sensor) and reconnects automatically with backoff. Point these at each Central
      Viewer's <code>packetPortalPort</code>, e.g.
      <code>https://central-1:8006;https://central-2:8006</code>. Include
      <code>user:pass@</code> when the Central Viewer has a <code>pass</code> for this node in
      <a href="#packetportal-nodes">[packetportal-nodes]</a>, where the user must be this Sensor's
      node name, e.g. <code>https://sensor1:sensor1rules@central-1:8006</code>. The node name
      itself is always sent automatically and does not need to be configured. Because the list is
      split on <code>;</code> and <code>,</code>, a password containing either must be percent
      encoded (<code>%3B</code>, <code>%2C</code>).

  - key: packetPortalCATrustFile
    value: "not set"
    text: |
      <strong>Sensor.</strong> Optional CA trust file used when connecting to an
      <code>https</code> Central Viewer with a private/self&#8209;signed certificate.

  - key: packetPortalKeepAliveSeconds
    value: "30"
    text: |
      <strong>Central Viewer.</strong> How often the Central Viewer makes a lightweight
      <code>/health</code> request over the portal to keep idle NAT/firewall/proxy mappings from
      dropping the connection and to detect dead portals. Set to 0 to disable.

  - key: packetPortalWaitSeconds
    value: "5"
    text: |
      <strong>Central Viewer.</strong> A Sensor reached via a portal cannot be contacted directly,
      so if its portal is momentarily down when a request needs it, the Central Viewer waits up to
      this many seconds for it to reconnect before failing with a clear error (instead of
      attempting a doomed direct connection).

  - key: packetPortalReverseTTLMinutes
    value: "60"
    text: |
      <strong>Central Viewer.</strong> How long after a Sensor's last portal the Central Viewer
      keeps treating it as reachable only by portal. Until this expires, requests for that Sensor
      wait for a portal (see <code>packetPortalWaitSeconds</code>) rather than being dialed
      directly. After it expires the Sensor is dialed directly again, so a node that is
      reconfigured to stop using portals recovers on its own instead of needing a Central Viewer
      restart.

after: |
  <p class="mb-0">
    Minimal example: a Central Viewer accepting portals on a dedicated TLS port, and a remote
    Sensor (behind NAT) that connects out to it. There is no
    <a href="#packetportal-nodes">[packetportal-nodes]</a> section, so each Sensor is pinned to the
    source IP it first connects from.
  </p>
  <pre><code># On the Central Viewer - reachable by the Sensors
  [central-viewer]
  packetPortalPort=8006
  packetPortalKeyFile=/opt/arkime/etc/packetPortal.key
  packetPortalCertFile=/opt/arkime/etc/packetPortal.crt

  # On each Sensor - behind NAT, cannot be reached directly
  [sensor1]
  packetPortalConnect=https://central.example.com:8006
  packetPortalCATrustFile=/opt/arkime/etc/central-ca.pem
  </code></pre>
  <p class="mb-0">
    Recommended: the same, but with each Sensor authenticated by a per node password and source IP,
    so one Sensor cannot claim another's node name.
  </p>
  <pre><code># On the Central Viewer
  [central-viewer]
  packetPortalPort=8006
  packetPortalKeyFile=/opt/arkime/etc/packetPortal.key
  packetPortalCertFile=/opt/arkime/etc/packetPortal.crt

  # Who may open a portal, and as which node.
  # Falls back to [esproxy-sensors] when this section is not present.
  [packetportal-nodes]
  sensor1=pass:sensor1rules;ip:10.10.10.10
  sensor2=pass:sensor2rules

  # On each Sensor - the user is this Sensor's node name,
  # the pass is its [packetportal-nodes] pass.
  [sensor1]
  packetPortalConnect=https://sensor1:sensor1rules@central.example.com:8006
  packetPortalCATrustFile=/opt/arkime/etc/central-ca.pem
  </code></pre>
  <p>
    <code>serverSecret</code> (or <code>passwordSecret</code>) must match on all viewers, as it
    does for normal server&#8209;to&#8209;server communication.
  </p>
